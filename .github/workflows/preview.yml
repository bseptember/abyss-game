name: Cloudflare Preview

# Uploads a Worker *version* (not production) so branches/PRs get
# https://<alias>-abyss-game.<account>.workers.dev
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches-ignore:
      - master
      - main

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  upload-preview:
    name: Upload preview version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            npm install --no-save wrangler@4
          fi

      - name: Build
        run: npm run build

      - name: Derive preview alias from branch
        id: alias
        shell: bash
        run: |
          REF="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          ALIAS=$(echo "$REF" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/-+/-/g' \
            | cut -c1-45)
          if [[ ! "$ALIAS" =~ ^[a-z] ]]; then
            ALIAS="b-${ALIAS}"
          fi
          echo "alias=${ALIAS}" >> "$GITHUB_OUTPUT"
          echo "Preview alias: ${ALIAS}"

      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          exit "$missing"

      - name: Upload Worker version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -o pipefail
          npx wrangler versions upload \
            --config "wrangler.jsonc" \
            --preview-alias "${{ steps.alias.outputs.alias }}" 2>&1 | tee upload.log

          URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev/?[a-zA-Z0-9./_-]*' upload.log \
            | head -n1 \
            | sed 's:/*$::' || true)

          if [ -z "$URL" ]; then
            URL="https://${{ steps.alias.outputs.alias }}-abyss-game.capysc.workers.dev"
            echo "::warning::Could not parse preview URL; using alias URL ${URL}"
          fi

          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "### Preview URL" >> "$GITHUB_STEP_SUMMARY"
          echo "[${URL}](${URL})" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.upload.outputs.url }}`;
            const alias = `${{ steps.alias.outputs.alias }}`;
            const marker = '<!-- cloudflare-preview -->';
            const body = [
              marker,
              '## Cloudflare preview',
              '',
              `**[${url}](${url})**`,
              '',
              `Alias: \`${alias}-abyss-game\` — same Worker, not production.`,
              '',
              `_Updated for \`${context.sha.slice(0, 7)}\`_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
